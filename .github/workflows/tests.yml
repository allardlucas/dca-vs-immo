name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests de non-régression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Les scripts standalone (issues 4, 5, 6, 16, 23–26) exposent des helpers
      # nommés test_* qui ne sont pas des tests pytest ; ils sont lancés ensuite.
      - name: Tests pytest
        run: |
          pytest tests/ -v \
            --ignore=tests/test_issue_4_lmnp_pv.py \
            --ignore=tests/test_issue_5_lmnp_monthly_tax.py \
            --ignore=tests/test_issue_6_surtaxe_pv.py \
            --ignore=tests/test_issue_16_deficit_foncier.py \
            --ignore=tests/test_issues_23_24_25_26.py

      - name: Scripts de non-régression fiscale
        run: |
          python tests/test_issue_4_lmnp_pv.py
          python tests/test_issue_5_lmnp_monthly_tax.py
          python tests/test_issue_6_surtaxe_pv.py
          python tests/test_issue_16_deficit_foncier.py
          python tests/test_issues_23_24_25_26.py

  deploy:
    name: Déployer sur GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déployer sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: ".github,tests,docs,requirements.txt,.gitignore"
          # Ne pas supprimer les fichiers existants (utile pour les previews)
          keep_files: true
          # Message de commit en français
          commit_message: "Déploiement automatique [skip ci]"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
